<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manipulation-language pretest</title>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.2/css/jspsych.css">
    <link rel="stylesheet" href="src/styles.css">
    <style>.startup-error { width: min(100%, 48rem); margin: 2rem auto; padding: 1.25rem; color: #4a1111; background: #fff0f0; border: 2px solid #a83232; border-radius: 0.75rem; }</style>
    <script src="https://unpkg.com/jspsych@8.2.2/dist/index.browser.min.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0/dist/index.browser.min.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.1.0/dist/index.browser.min.js"></script>
    <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe@0.6.0"></script>
  </head>
  <body>
    <div class="prototype-banner" role="note">Manipulation-language pretest — local test data only.</div>
    <main id="pretest-target" aria-live="polite"></main>
    <noscript>This pretest requires JavaScript.</noscript>
    <script type="module" src="src/pretest.js"></script>
    <script>
      window.addEventListener("load", function reportStartupFailure() {
        window.setTimeout(function checkPretestStartup() {
          const missing = [];
          if (typeof window.initJsPsych !== "function") missing.push("jsPsych core");
          if (typeof window.jsPsychHtmlButtonResponse === "undefined") missing.push("HTML Button Response plugin");
          if (typeof window.jsPsychSurveyHtmlForm === "undefined") missing.push("Survey HTML Form plugin");
          if (typeof window.jsPsychPipe === "undefined") missing.push("DataPipe plugin");
          const target = document.getElementById("pretest-target");
          if (target && target.childElementCount === 0) missing.push("the pretest ES module");
          if (!target || missing.length === 0) return;
          const error = document.createElement("section");
          error.className = "startup-error";
          error.setAttribute("role", "alert");
          error.innerHTML = `<h1>Pretest failed to start</h1><p>Could not load: ${missing.join(", ")}.</p><p>Run npm install, then npm start, and inspect the browser console and network panel.</p>`;
          target.replaceChildren(error);
        }, 1000);
      });
    </script>
  </body>
</html>
